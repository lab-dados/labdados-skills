name: juscraper-cobertura

# Confere a cobertura descrita na skill juscraper contra o codigo da main do
# juscraper. Em PR, reprova a mudanca que deixa a skill fora de sincronia. No
# agendamento semanal, pega o caso inverso: o juscraper ganhou ou perdeu um
# metodo e a skill nao acompanhou; ai abre uma issue aqui (ou comenta na aberta,
# ou reabre a fechada). Quando uma execucao na main volta a passar, a issue
# aberta e fechada sozinha.
#
# O `gerar` e separado do `conferir` porque executa codigo de outro repositorio
# (jtrecenti/juscraper). Ele roda sem permissao de escrita e sem credencial
# gravada no checkout, e so entrega o JSON como artefato, que o `conferir` le
# como dado. So `avisar` e `fechar` podem escrever issue, e nenhum dos dois
# executa codigo do juscraper nem le o artefato.

on:
  pull_request:
    branches: [main]
    paths:
      - "plugins/juscraper/**"
      - "scripts/cobertura_juscraper.py"
      - "tests/test_cobertura_juscraper.py"
      - ".github/workflows/juscraper-cobertura.yml"
  push:
    branches: [main]
    paths:
      - "plugins/juscraper/**"
      - "scripts/cobertura_juscraper.py"
      - "tests/test_cobertura_juscraper.py"
      - ".github/workflows/juscraper-cobertura.yml"
  schedule:
    - cron: "0 11 * * 1" # segunda, 08h em Brasilia
  workflow_dispatch:

# Uma execucao por vez em cada ref, sem cancelar a que esta rodando. Sem isso,
# um push na main cujo `gerar` leu o juscraper antes de uma mudanca podia
# terminar depois de um agendamento que reprovou, e o `fechar` dele fechava a
# issue recem-aberta pelo `avisar`.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TITULO: "juscraper-cobertura reprovou no agendamento"
  EXECUCAO: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  gerar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jtrecenti/juscraper
          ref: main
          path: juscraper
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Cobertura a partir do codigo do juscraper
        run: |
          mkdir -p saida
          uv run --directory juscraper --python 3.12 --no-dev \
            python scripts/tabela_cobertura.py --json > saida/cobertura.json
          echo "juscraper main em $(git -C juscraper rev-parse --short HEAD)"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cobertura-juscraper
          path: saida/cobertura.json
          retention-days: 7

  conferir:
    needs: gerar
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cobertura-juscraper
          path: ${{ runner.temp }}

      - name: Testes do sincronizador
        run: uv run --no-project --python 3.12 --with pytest pytest tests/test_cobertura_juscraper.py -q

      - name: Skill em sincronia com o juscraper
        run: python scripts/cobertura_juscraper.py "$RUNNER_TEMP/cobertura.json" --check

  # Job proprio, para avisar tambem quando quem falha e o `gerar` (main do
  # juscraper quebrada ou sem o script), caso em que o `conferir` nem roda.
  avisar:
    needs: [gerar, conferir]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      # Uma issue so para o problema: comenta na aberta; se nao ha, reabre a
      # fechada mais recente de mesmo titulo; so cria quando nunca houve.
      - name: Abrir, reabrir ou comentar a issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          corpo="A execucao agendada de juscraper-cobertura reprovou: $EXECUCAO

          Se o job que falhou foi o conferir, a skill ficou fora de sincronia com o juscraper. Para corrigir, com um checkout do juscraper em ../juscraper:

              uv run --directory ../juscraper --python 3.12 --no-dev python scripts/tabela_cobertura.py --json > /tmp/cobertura.json
              python scripts/cobertura_juscraper.py /tmp/cobertura.json

          Depois revise a description da SKILL.md e as tags de versao das references. Se o job que falhou foi o gerar, o problema esta no juscraper (main quebrada ou scripts/tabela_cobertura.py ausente)."
          achado=$(gh issue list --state all --search "in:title \"$TITULO\" sort:created-desc" \
            --json number,title,state \
            --jq '[.[] | select(.title == env.TITULO)] | (map(select(.state == "OPEN")) + .) | first(.[]) | "\(.number) \(.state)"')
          read -r numero estado <<< "$achado"
          case "$estado" in
            OPEN) gh issue comment "$numero" --body "$corpo" ;;
            CLOSED) gh issue reopen "$numero" --comment "$corpo" ;;
            *) gh issue create --title "$TITULO" --body "$corpo" ;;
          esac

  # Fecha a issue do `avisar` quando a conferencia volta a passar em qualquer
  # execucao na main. A busca por titulo exato tem de ser a mesma do `avisar`.
  fechar:
    needs: conferir
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Fechar a issue aberta
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          numeros=$(gh issue list --state open --search "in:title \"$TITULO\"" --json number,title \
            --jq '.[] | select(.title == env.TITULO) | .number')
          for numero in $numeros; do
            gh issue close "$numero" --reason completed \
              --comment "juscraper-cobertura voltou a passar na main: $EXECUCAO"
          done
