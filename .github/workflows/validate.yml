name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate marketplace.json is valid JSON
        run: python -c "import json; json.load(open('.claude-plugin/marketplace.json'))"

      - name: Validate each plugin.json is valid JSON
        run: |
          for f in plugins/*/.claude-plugin/plugin.json; do
            echo "Validating $f"
            python -c "import json; json.load(open('$f'))"
          done

      - name: Verify each plugin source exists and has a SKILL.md
        run: python3 scripts/conferir_marketplace.py

      - name: Validate plugins with Claude Code
        run: |
          for plugin in plugins/*; do
            if [ -f "$plugin/.claude-plugin/plugin.json" ]; then
              echo "Validating $plugin"
              npx --yes @anthropic-ai/claude-code@2.1.126 plugin validate "$plugin"
            fi
          done

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Test raspador-builder and repo scripts (Python 3.10 and 3.12)
        # O robots.txt e o modelo de raspador têm de dar a mesma resposta nas versões do Python
        # em que a suíte roda aqui, 3.10 e 3.12. A pasta tests/ cobre os scripts do repo, entre
        # eles o empacotamento dos zips para o claude.ai.
        run: |
          for versao in 3.10 3.12; do
            uv run --no-project --python "$versao" --with pytest --with requests --with pandas \
              pytest plugins/raspador-builder/tests tests -q
          done
